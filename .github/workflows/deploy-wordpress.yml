name: Deploy to WordPress.org

on:
  push:
    tags:
      - '*'

jobs:
  build:
    name: Build and Deploy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Validate release version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          release_version="${RELEASE_TAG#v}"
          stable_tag="$(sed -n 's/^Stable tag: *//p' readme.txt | head -n 1)"
          plugin_version="$(sed -nE 's/^[[:space:]]*\* Version:[[:space:]]*([^[:space:]]+).*/\1/p' wp-logos.php | head -n 1)"
          package_version="$(node -p "require('./package.json').version")"

          if [[ -z "$stable_tag" || "$release_version" != "$stable_tag" || "$release_version" != "$plugin_version" || "$release_version" != "$package_version" ]]; then
            echo "::error::Git tag ($release_version), readme Stable tag ($stable_tag), wp-logos.php Version ($plugin_version), and package.json version ($package_version) must match."
            exit 1
          fi

      - name: Install dependencies
        run: npm ci

      - name: Build assets
        run: npm run build

      - name: Deploy to WordPress.org
        uses: 10up/action-wordpress-plugin-deploy@stable
        env:
          SVN_PASSWORD: ${{ secrets.SVN_PASSWORD }}
          SVN_USERNAME: ${{ secrets.SVN_USERNAME }}
          SLUG: yolo-logos
